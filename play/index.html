html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}
body {
	color: #f7f3e8;
	background: #5b9bdc;
	overflow: hidden;
	touch-action: none;
}
#canvas {
	display: block;
}
#canvas:focus {
	outline: none;
}
#status {
	position: fixed;
	inset: 0;
	overflow: hidden;
	transition: opacity 0.35s;
}
#status.done {
	opacity: 0;
}
#scene {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	object-fit: cover;
	image-rendering: pixelated;
}
#words {
	position: absolute;
	left: 16px;
	right: 16px;
	top: 12%;
	text-align: center;
	font-family: "Pixel", system-ui, sans-serif;
	-webkit-font-smoothing: none;
	text-shadow: 0 3px 0 #2b2238;
}
#words h1 {
	margin: 0;
	font-size: clamp(36px, 7vw, 72px);
	font-weight: normal;
	line-height: 1.1;
	color: #f2c94c;
}
#words p {
	margin: 8px 0 0;
	font-size: clamp(24px, 3.4vw, 36px);
	color: #f7f3e8;
}
#loading {
	position: absolute;
	left: 16px;
	right: 16px;
	bottom: 13%;
	text-align: center;
	font: 24px "Pixel", system-ui, sans-serif;
	-webkit-font-smoothing: none;
	color: #2b2238;
}
#hops {
	position: absolute;
	left: 0;
	right: 0;
	bottom: calc(13% - 26px);
	text-align: center;
}
#hops i {
	display: inline-block;
	width: 8px;
	height: 8px;
	margin: 0 4px;
	background: #2b2238;
	will-change: transform;
	animation: hop 0.9s steps(4) infinite;
}
#hops i:nth-child(2) {
	background: #c29a2e;
	animation-delay: 0.15s;
}
#hops i:nth-child(3) {
	animation-delay: 0.3s;
}
@keyframes hop {
	0%, 100% {
		transform: translateY(0);
	}
	50% {
		transform: translateY(-10px);
	}
}
/* 手机竖着拿：游戏是横屏的，先请人横过来（下面照常在加载） */
#turn {
	display: none;
	position: fixed;
	inset: 0;
	z-index: 10;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 28px;
	background: #2b2238;
	color: #f7f3e8;
	font: 24px "Pixel", system-ui, sans-serif;
	-webkit-font-smoothing: none;
}
#turn i {
	width: 26px;
	height: 44px;
	border: 4px solid #f2c94c;
	border-radius: 4px;
	animation: turn 2.4s steps(1) infinite;
}
@keyframes turn {
	0%, 40% {
		transform: rotate(0deg);
	}
	50%, 90% {
		transform: rotate(90deg);
	}
}
@media (orientation: portrait) and (pointer: coarse) {
	#turn {
		display: flex;
	}
}
#status-notice {
	display: none;
	position: absolute;
	left: 16px;
	right: 16px;
	bottom: 24px;
	padding: 12px;
	border-radius: 4px;
	background: #2b2238;
	color: #f7f3e8;
	font: 15px/1.5 system-ui, sans-serif;
	text-align: center;
}

<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<noscript>Your browser does not support JavaScript.</noscript>

<div id="status">
	<canvas id="scene" width="320" height="180"></canvas>
	<div id="words"><h1 id="name">Islands in the Sky</h1><p id="sub">The Lost Kingdom</p></div>
	<div id="loading">Loading</div>
	<div id="hops"><i></i><i></i><i></i></div>
	<div id="status-notice"></div>
</div>

<div id="turn"><i></i><span id="turn-words">Turn your phone sideways</span></div>

<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":1069612,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const status = document.getElementById('status');
	const notice = document.getElementById('status-notice');
	const loading = document.getElementById('loading');
	const chinese = (navigator.language || '').toLowerCase().startsWith('zh');
	const words = chinese
		? {name: '空中之岛', sub: '失落的王国', load: '加载中', almost: '马上就好', turn: '把手机横过来'}
		: {name: 'Islands in the Sky', sub: 'The Lost Kingdom', load: 'Loading', almost: 'Almost there', turn: 'Turn your phone sideways'};
	document.getElementById('name').textContent = words.name;
	document.getElementById('sub').textContent = words.sub;
	loading.textContent = words.load;
	document.getElementById('turn-words').textContent = words.turn;

	// 加载动画：金线顺着进度缝过去，红斗篷的小人跟着滑。
	const scene = document.getElementById('scene').getContext('2d');
	const W = 320;
	const H = 180;
	const SKY = ['#5b9bdc', '#6ea9e0', '#86b9e4', '#a9cfe8', '#cbdde0', '#e4dfcc', '#f3dfbd'];
	const CLOUDS = [[20, 58, 7], [120, 42, 4], [214, 70, 6], [290, 48, 3]];
	const LEFT = 62;
	const RIGHT = 258;
	const LINE = 128;
	let target = null;
	let shown = 0;
	let running = true;
	let start = performance.now();

	function box(color, x, y, w, h) {
		scene.fillStyle = color;
		scene.fillRect(Math.round(x), Math.round(y), w, h);
	}

	function cloud(x, y) {
		box('#fff8ea', x + 6, y, 16, 3);
		box('#fff8ea', x + 2, y + 3, 26, 3);
		box('#fff8ea', x, y + 6, 32, 3);
		box('#e8d8c6', x, y + 9, 32, 1);
	}

	function island(x, y, w) {
		box('#5fae4f', x, y, w, 3);
		box('#b8734a', x, y + 3, w, 4);
		box('#6d5c97', x + 1, y + 7, w - 2, 5);
		box('#5a4b82', x + 4, y + 12, w - 8, 4);
		box('#4a3d6e', x + 9, y + 16, w - 18, 3);
		box('#3d3160', x + 14, y + 19, w - 28, 2);
		box('#f2c94c', x + Math.floor(w * 0.3), y + 7, 1, 8);
		box('#f2c94c', x + Math.floor(w * 0.7), y + 7, 1, 10);
	}

	function hero(x, y, flap) {
		box('#2b2238', x + 1, y - 7, 4, 4);
		box('#f3c9a0', x + 2, y - 6, 3, 2);
		box('#d94a3d', x, y - 3, 5, 3);
		box('#d94a3d', x - 7, y - 3 + flap, 8, 2);
		box('#a93530', x - 10, y - 2 + flap, 4, 1);
		box('#2b2238', x + 1, y, 3, 1);
	}

	function draw(now) {
		if (!running) {
			return;
		}
		const t = (now - start) / 1000;
		// 还不知道总大小时，先慢慢往前走，停在九成
		const goal = target === null ? 0.9 * (1 - Math.exp(-t / 12)) : target;
		shown += (goal - shown) * 0.08;
		const head = LEFT + (RIGHT - LEFT) * shown;

		SKY.forEach((color, i) => box(color, 0, Math.floor(i * H / SKY.length), W, Math.ceil(H / SKY.length)));
		CLOUDS.forEach(([x, y, speed]) => cloud(((x + t * speed) % (W + 40)) - 36, y));
		island(14, LINE + Math.round(Math.sin(t * 1.4) * 1.5) - 2, 50);
		island(258, LINE + Math.round(Math.sin(t * 1.4 + 2) * 1.5) - 2, 50);

		for (let x = LEFT; x < RIGHT; x += 6) {
			box(x < head ? '#f2c94c' : 'rgba(43, 34, 56, 0.25)', x, LINE - 1, 3, 2);
		}
		const glow = 0.6 + 0.4 * Math.sin(t * 8);
		scene.globalAlpha = glow;
		box('#fff8ea', head - 2, LINE - 3, 5, 5);
		scene.globalAlpha = 1;
		hero(head - 2, LINE - 9 + Math.round(Math.sin(t * 3)), Math.floor(t * 8) % 2);

		if (target !== null) {
			// 网慢的时候前几个百分点要很久，带一位小数，看得出还在动
			const percent = shown < 0.1 ? (Math.floor(shown * 1000) / 10).toFixed(1) : Math.min(99, Math.floor(shown * 100));
			loading.textContent = shown > 0.985 ? words.almost : words.load + ' ' + percent + '%';
		}
		requestAnimationFrame(draw);
	}
	requestAnimationFrame(draw);

	function fail(message) {
		console.error(message);
		running = false;
		loading.textContent = '';
		notice.textContent = message instanceof Error ? message.message : String(message);
		notice.style.display = 'block';
	}

	const missing = Engine.getMissingFeatures({threads: GODOT_THREADS_ENABLED});
	if (missing.length !== 0) {
		fail('Your browser is missing: ' + missing.join(', '));
		return;
	}
	engine.startGame({
		onProgress: function (current, total) {
			if (current > 0 && total > 0) {
				target = current / total;
			}
		},
	}).then(() => {
		status.classList.add('done');
		setTimeout(() => {
			running = false;
			status.remove();
		}, 400);
	}, fail);
}());
</script>
</body>
